name: Issue Release Workflow PoC

on:
  issues:
    types: [opened]

jobs:
  poc:
    runs-on: ubuntu-latest
    env:
      COMMENT_BODY: ${{ github.event.issue.body }}
    steps:
      - uses: actions/checkout@v4

      - name: Show attacker-controlled input
        run: |
          echo "=== RAW ISSUE BODY ==="
          printf "%q\n" "$COMMENT_BODY"

      - name: Backport Commits
        run: |
          printf "%s" "$COMMENT_BODY" |
          ./llvm/utils/git/github-automation.py release-workflow
